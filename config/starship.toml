# Starship prompt configuration

format = """
[](fg:blue)\
$os\
$username\
[](fg:blue bg:teal)\
$directory\
[](fg:teal bg:green)\
$git_branch\
$git_status\
[](fg:green bg:yellow)\
$nodejs\
$python\
$rust\
$golang\
[](fg:yellow bg:purple)\
$docker_context\
[](fg:purple)\
$fill\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bg:blue fg:crust bold"

[os.symbols]
Macos = " "
Linux = " "
Windows = " "

[username]
show_always = false
style_user = "bg:blue fg:crust bold"
style_root = "bg:red fg:crust bold"
format = "[$user]($style)"

[directory]
style = "bg:teal fg:crust bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Code" = " "
"Projects" = " "

[git_branch]
symbol = " "
style = "bg:green fg:crust"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:green fg:crust"
format = "[$all_status$ahead_behind ]($style)"

[nodejs]
symbol = " "
style = "bg:yellow fg:crust"
format = "[ $symbol$version ]($style)"

[python]
symbol = " "
style = "bg:yellow fg:crust"
format = "[ $symbol$version ]($style)"

[rust]
symbol = " "
style = "bg:yellow fg:crust"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "bg:yellow fg:crust"
format = "[ $symbol$version ]($style)"

[docker_context]
symbol = " "
style = "bg:purple fg:crust"
format = "[ $symbol$context ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[line_break]
disabled = false
