# kitty.conf — tuned for MacBook Pro (M4 Pro, 120 Hz Liquid Retina XDR)
# Docs: https://sw.kovidgoyal.net/kitty/conf/
# Reload without restarting: cmd+ctrl+,   (or: kitten @ load-config)

# ── Font ────────────────────────────────────────────────────────────
# "Mono" build of JetBrainsMono Nerd Font: kitty (CoreText) only matches the
# single-width variant; the wide-icon "JetBrainsMono Nerd Font" is rejected.
# Prompt/eza icons render with no
# symbol_map fallback tables. Installed via:
#   brew install --cask font-jetbrains-mono-nerd-font
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      auto
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size        14.0
# Ligatures on, but broken at the cursor so column alignment stays obvious.
disable_ligatures cursor
undercurl_style   thin-sparse
# Retina: let macOS handle subpixel/gamma; no artificial thickening.
text_composition_strategy platform

# ── Theme ───────────────────────────────────────────────────────────
# Catppuccin Mocha, same as Ghostty + Starship. Swap with `kitten themes`.
include current-theme.conf

# ── Window ──────────────────────────────────────────────────────────
window_padding_width  4 8
placement_strategy    center
remember_window_size  yes
initial_window_width  140c
initial_window_height 40c
hide_window_decorations no
macos_titlebar_color  background
macos_show_window_title_in window
macos_window_resizable yes
confirm_os_window_close -1
inactive_text_alpha   0.7
window_border_width   1pt
draw_minimal_borders  yes

# Translucency + blur (native macOS backdrop). cmd+ctrl+[ / ] adjust live.
background_opacity         0.92
dynamic_background_opacity yes
background_blur            40

# ── Rendering / performance ─────────────────────────────────────────
# 120 Hz ProMotion panel: 8 ms repaint budget ≈ 120 fps. input_delay low
# because the M4 Pro is never the bottleneck.
repaint_delay   8
input_delay     2
sync_to_monitor yes

# ── Scrollback ──────────────────────────────────────────────────────
scrollback_lines              10000
scrollback_pager_history_size 64
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier   5.0
touch_scroll_multiplier   1.0

# ── Cursor ──────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0
cursor_trail          3
cursor_trail_decay    0.1 0.3
cursor_trail_start_threshold 2

# ── Mouse / URLs / clipboard ────────────────────────────────────────
mouse_hide_wait        3.0
url_style              curly
detect_urls            yes
strip_trailing_spaces  smart
select_by_word_characters @-./_~?&=%+#
focus_follows_mouse    no

# ── Bell ────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab          "🔔 "

# Native notification when a command >20 s finishes in an unfocused window.
# (Needs shell integration, enabled below.)
notify_on_cmd_finish invisible 20.0

# ── Tabs ────────────────────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2
tab_title_max_length 30
tab_title_template  "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index} {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Layouts ─────────────────────────────────────────────────────────
# "splits" gives tmux-style panes; "stack" = zoom one pane fullscreen.
enabled_layouts splits, stack

# ── Shell integration / remote control ──────────────────────────────
# kitty injects its zsh integration itself; nothing needed in .zshrc.
shell_integration    enabled
allow_remote_control socket-only
listen_on            unix:/tmp/kitty
# kitty.app is not managed by Homebrew here, so keep the in-app updater on.
update_check_interval 24

# ── macOS ───────────────────────────────────────────────────────────
macos_option_as_alt               yes
macos_quit_when_last_window_closed yes
macos_traditional_fullscreen      no
macos_menubar_title_max_length    0

# ── Keys (macOS conventions, cmd-based) ─────────────────────────────
# kitty's defaults already give: cmd+t new tab, cmd+w close, cmd+n new
# OS window, cmd+1..9 goto tab, cmd+c/v copy/paste, cmd+=/- font size.
# Splits
map cmd+d        launch --cwd=current --location=vsplit
map cmd+shift+d  launch --cwd=current --location=hsplit
map cmd+enter    toggle_layout stack
# Move between panes
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
# Resize panes
map cmd+ctrl+left  resize_window narrower 3
map cmd+ctrl+right resize_window wider 3
map cmd+ctrl+up    resize_window taller 3
map cmd+ctrl+down  resize_window shorter 3
map cmd+ctrl+r     resize_window reset
# Tabs
map cmd+shift+[  previous_tab
map cmd+shift+]  next_tab
map cmd+shift+t  set_tab_title
# Scrollback in pager / last command output
map cmd+f        show_scrollback
map cmd+shift+f  show_last_command_output
map cmd+k        clear_terminal to_cursor active
# Hints kitten: open URLs / copy paths / hashes from screen
map cmd+shift+u  open_url_with_hints
map cmd+shift+p  kitten hints --type path --program -
map cmd+shift+h  kitten hints --type hash --program -
# Background opacity live adjust
map cmd+ctrl+]   set_background_opacity +0.05
map cmd+ctrl+[   set_background_opacity -0.05
map cmd+ctrl+0   set_background_opacity default
# Config
map cmd+ctrl+,   load_config_file
map cmd+,        edit_config_file
